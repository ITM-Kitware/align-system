name: action_based

defaults:
  - _self_
  - interface: input_output_file
  - adm: outlines_transformers_structured_baseline
  - driver: itm_phase1
  - override hydra/job_logging: custom

loglevel: "EXPLAIN"

# Preserve existing agent formatting and fresh logs for established experiments.
# The logging/agent profile additionally enables the interaction transcript.
agent_log_rendering: true
save_agent_transcript: false
raw_log_mode: w

save_log: true
save_raw_log: true
save_input_output: true
save_scoring_output: true
save_alignment_targets: false
save_timing: true
save_last_unstructured_state_per_scenario: false

# Replay a previous LangChain Kaleido/CR run into a fresh TA3 session.
resume_from: null
save_agent_checkpoint: true

align_to_target: false
