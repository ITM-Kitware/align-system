defaults:
  - phase2_pipeline_zeroshot_comparative_regression
  - /adm_component/icl@step_definitions.regression_icl: rag_phase2_comparative
  - override /adm_component/regression@step_definitions.comparative_regression: phase2_comparative_no_template
  - _self_

name: phase2_pipeline_rag_comparative_regression

embedding_model:
  _target_: llama_index.embeddings.huggingface.HuggingFaceEmbedding
  model_name: sentence-transformers/all-MiniLM-L6-v2

instance:
  steps:
    - ${ref:adm.step_definitions.format_choices}
    - ${ref:adm.step_definitions.regression_icl}
    - ${ref:adm.step_definitions.comparative_regression}
    - ${ref:adm.step_definitions.regression_rule_based_correction}
    - ${ref:adm.step_definitions.scalar_alignment}
    - ${ref:adm.step_definitions.justification_from_reasonings}
    - ${ref:adm.step_definitions.ensure_chosen_action}
    - ${ref:adm.step_definitions.populate_choice_info}
