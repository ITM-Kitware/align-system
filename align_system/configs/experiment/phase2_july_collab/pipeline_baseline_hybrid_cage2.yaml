# @package _global_
defaults:
  - override /adm: pipeline_baseline
  - override /inference_engine@adm.structured_inference_engine: outlines_structured_greedy
  - override /interface: hybrid_cage2

interface:
  # Paths are relative to the directory from which you launch the experiment.
  scenario_path: ../CAGE2/CybORG/CybORG/Shared/Scenarios/scalability_experiments/base_with_resilience_tied.yaml
  red_agent: Meander-C
  red_agent_labels: [Sleep, Meander, B-line, B-line-C, B-line-I, B-line-A, Meander-C, Meander-I, Meander-A]

# Change this directory in YAML or override blue_policy_dir on the command line.
blue_policy_dir: /data/shared/aaai_aics2026/rl_checkpoints

# Map each LLM label to its trained blue PPO checkpoint (.zip is optional).
# Filenames below default to <label>.zip; edit them to match your actual files.
# Use checkpoints trained for the resilience-tied scenario's 178 actions.
blue_policy_paths:
  Sleep: ${blue_policy_dir}/Sleep.zip
  Meander: ${blue_policy_dir}/Meander.zip
  B-line: ${blue_policy_dir}/B-line.zip
  B-line-C: ${blue_policy_dir}/B-line-C.zip
  B-line-I: ${blue_policy_dir}/B-line-I.zip
  B-line-A: ${blue_policy_dir}/B-line-A.zip
  Meander-C: ${blue_policy_dir}/Meander-C.zip
  Meander-I: ${blue_policy_dir}/Meander-I.zip
  Meander-A: ${blue_policy_dir}/Meander-A.zip


adm:
  structured_inference_engine:
    # model_name: TinyLlama/TinyLlama-1.1B-Chat-v1.0
    model_name: fdtn-ai/Foundation-Sec-8B-Instruct
    # model_name: mistralai/Mistral-7B-Instruct-v0.3
  step_definitions:
    format_choices:
      _target_: align_system.algorithms.misc_itm_adm_components.CAGERedAgentADMComponent
    outlines_baseline:
      scenario_description_template:
        _target_: align_system.prompt_engineering.outlines_prompts.CAGEScenarioDescription
      prompt_template:
        _target_: align_system.prompt_engineering.outlines_prompts.Phase2BaselinePrompt
      system_prompt_template:
        _target_: align_system.prompt_engineering.outlines_prompts.CAGERedAgentSystemPrompt

      enable_caching: true

    action_parameter_completion:
      _target_: align_system.algorithms.cage_action_parameter_completion_adm_component.CAGERedAgentParameterCompletionADMComponent

  instance:
    steps:
    # Reference the step instances we want to use in order
    - ${ref:adm.step_definitions.format_choices}
    - ${ref:adm.step_definitions.outlines_baseline}
    - ${ref:adm.step_definitions.action_parameter_completion}
    - ${ref:adm.step_definitions.ensure_chosen_action}

apply_action_filtering: false
save_scoring_output: true

force_determinism: true
align_to_target: false
sort_available_actions: false
