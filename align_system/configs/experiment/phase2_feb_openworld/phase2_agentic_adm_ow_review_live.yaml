# @package _global_
# February scenarios with the current Qwen/vLLM weighted reviewer setup.
# The decision agent selects the final action on a fresh turn after review.
defaults:
  - /logging: agent
  - override /adm: langchain_agentic
  - override /interface: ta3
  - override /driver: itm_phase2_ow_agentic
  - override /adm/reviewer@adm.instance.reviewer: weighted
  # The review driver selects weighted advice. Both agents share the
  # separately served Qwen model; see this model preset for launch settings.
  - override /driver/chat_model@adm.instance.chat_model: vllm_qwen38_27b

driver:
  scene_end_policy: auto

adm:
  instance:
    chat_model:
      base_url: http://127.0.0.1:8000/v1
    reviewer:
      response_format: vllm_json_schema
      max_repair_attempts: 1

interface:
  api_endpoint: https://darpaitm.caci.com
  session_type: eval
  training_session: null
  username: "testrun-ALIGN-ADM-Ph2-Feb2026-LangChainAgent-ReviewerWeighted-Live-Qwen3.8-27B-FP8"
  domain: "owtriage"
  adm_profile: FEB_OPENWORLD3

force_determinism: true
align_to_target: true
save_last_unstructured_state_per_scenario: true
