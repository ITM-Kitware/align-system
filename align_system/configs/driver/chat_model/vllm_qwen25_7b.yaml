# HuggingFace model served locally by vLLM's OpenAI-compatible
# endpoint.  The server is started automatically on first use (and
# shut down at exit); a server already listening at base_url is reused
# instead, so you can also serve manually, e.g.:
#   vllm serve Qwen/Qwen2.5-7B-Instruct --enable-auto-tool-choice \
#     --tool-call-parser hermes --port 8000
_target_: align_system.utils.vllm_chat_model.VLLMServerChatModel
model: Qwen/Qwen2.5-7B-Instruct
base_url: http://localhost:8000/v1
api_key: EMPTY
temperature: 0.0
