# HuggingFace model served locally by vLLM's OpenAI-compatible
# endpoint (started automatically on first use; see vllm_qwen25_7b for
# details).  Qwen2.5-3B is the smallest of the Qwen2.5 instruct models
# observed reliably driving the agent loop with structured tool calls
# (1.5B tends to emit dangling <tool_call> tags instead); at
# max-model-len 4096 it fits an 8GB GPU
_target_: align_system.utils.vllm_chat_model.VLLMServerChatModel
model: Qwen/Qwen2.5-3B-Instruct
base_url: http://localhost:8000/v1
api_key: EMPTY
temperature: 0.0
serve_args:
  - --max-model-len
  - 4096
